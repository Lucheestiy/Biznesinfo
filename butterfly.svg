<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <!-- Градиент для левого верхнего крыла -->
    <linearGradient id="wing-top-left" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Градиент для правого верхнего крыла -->
    <linearGradient id="wing-top-right" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Градиент для левого нижнего крыла -->
    <linearGradient id="wing-bottom-left" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00bfff" />
    </linearGradient>

    <!-- Градиент для правого нижнего крыла -->
    <linearGradient id="wing-bottom-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00bfff" />
    </linearGradient>

    <radialGradient id="body-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
  </defs>

  <!-- Усики -->
  <path d="M 96 40 Q 80 15 70 25" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
  <circle cx="70" cy="25" r="2" fill="#2c3e50"/>
  
  <path d="M 104 40 Q 120 15 130 25" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
  <circle cx="130" cy="25" r="2" fill="#2c3e50"/>

  <!-- Левое верхнее крыло -->
  <path d="M 95 60 C 50 10, -10 40, 20 90 C 40 120, 80 100, 95 80 Z" fill="url(#wing-top-left)" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Правое верхнее крыло -->
  <path d="M 105 60 C 150 10, 210 40, 180 90 C 160 120, 120 100, 105 80 Z" fill="url(#wing-top-right)" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" />

  <!-- Левое нижнее крыло -->
  <path d="M 95 85 C 70 120, 20 160, 45 180 C 70 190, 90 140, 95 120 Z" fill="url(#wing-bottom-left)" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" />

  <!-- Правое нижнее крыло -->
  <path d="M 105 85 C 130 120, 180 160, 155 180 C 130 190, 110 140, 105 120 Z" fill="url(#wing-bottom-right)" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" />

  <!-- Узоры на левом верхнем крыле -->
  <circle cx="45" cy="55" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="30" cy="75" r="5" fill="#ffffff" opacity="0.6"/>
  <path d="M 75 75 Q 60 50 45 40" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>

  <!-- Узоры на правом верхнем крыле -->
  <circle cx="155" cy="55" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="170" cy="75" r="5" fill="#ffffff" opacity="0.6"/>
  <path d="M 125 75 Q 140 50 155 40" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>

  <!-- Узоры на левом нижнем крыле -->
  <circle cx="65" cy="140" r="6" fill="#ffd700" opacity="0.9"/>
  <circle cx="50" cy="160" r="4" fill="#ffffff" opacity="0.7"/>
  
  <!-- Узоры на правом нижнем крыле -->
  <circle cx="135" cy="140" r="6" fill="#ffd700" opacity="0.9"/>
  <circle cx="150" cy="160" r="4" fill="#ffffff" opacity="0.7"/>

  <!-- Тело -->
  <!-- Голова -->
  <ellipse cx="100" cy="45" rx="6" ry="8" fill="url(#body-gradient)"/>
  <!-- Глаза -->
  <circle cx="97" cy="43" r="1.5" fill="#ffffff"/>
  <circle cx="103" cy="43" r="1.5" fill="#ffffff"/>
  
  <!-- Грудка -->
  <ellipse cx="100" cy="65" rx="8" ry="15" fill="url(#body-gradient)"/>
  
  <!-- Брюшко -->
  <ellipse cx="100" cy="100" rx="6" ry="25" fill="url(#body-gradient)"/>
  
  <!-- Полоски на брюшке -->
  <path d="M 95 90 Q 100 93 105 90" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M 94 100 Q 100 103 106 100" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M 95 110 Q 100 113 105 110" fill="none" stroke="#1a1a1a" stroke-width="1"/>
</svg>