map $cookie_biznesinfo_portal_access $biznesinfo_host_access_granted {
    default 0;
    "59b9be9f1e564d7799a253cf6120fca7511a8ab46e9c6904ae66b54bff2642d7" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name biznesinfo.lucheestiy.com;

    access_log /var/log/nginx/biznesinfo.lucheestiy.com.access.log;
    error_log /var/log/nginx/biznesinfo.lucheestiy.com.error.log;

    client_max_body_size 50m;
    absolute_redirect off;

    location = /__portal-login {
        auth_basic off;
        alias /home/mlweb/biznesinfo.lucheestiy.com/nginx/conf.d/portal-login.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /__portal-auth-check {
        auth_basic "Restricted Access";
        auth_basic_user_file /home/mlweb/biznesinfo.lucheestiy.com/nginx/conf.d/.htpasswd;
        alias /home/mlweb/biznesinfo.lucheestiy.com/nginx/conf.d/portal-auth-ok.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "biznesinfo_portal_access=59b9be9f1e564d7799a253cf6120fca7511a8ab46e9c6904ae66b54bff2642d7; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax";
    }

    location = /__portal-logout {
        auth_basic off;
        add_header Cache-Control "no-store";
        add_header Set-Cookie "biznesinfo_portal_access=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax";
        return 302 /__portal-login;
    }

    location / {
        if ($biznesinfo_host_access_granted = 0) {
            return 302 /__portal-login?next=$request_uri;
        }
        proxy_pass http://127.0.0.1:8116;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
