<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход на biznesinfo.by</title>
    <style>
      :root {
        color-scheme: light;
        --bg-1: #8f005f;
        --bg-2: #b10374;
        --panel: rgba(255, 255, 255, 0.14);
        --panel-border: rgba(255, 255, 255, 0.24);
        --text: #fff7fb;
        --muted: rgba(255, 247, 251, 0.78);
        --accent: #ffd54f;
        --accent-strong: #ffbf00;
        --danger: #ffe2e2;
        --danger-bg: rgba(120, 12, 49, 0.34);
        --success-bg: rgba(255, 213, 79, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top right, rgba(255, 213, 79, 0.18), transparent 30%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        width: min(100%, 440px);
        border-radius: 24px;
        padding: 28px 22px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 24px 60px rgba(54, 0, 32, 0.35);
        backdrop-filter: blur(14px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 213, 79, 0.14);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }

      form {
        margin-top: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }

      .field {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 16px;
        color: #2b1030;
        background: rgba(255, 255, 255, 0.96);
        outline: none;
      }

      .field:focus {
        border-color: var(--accent-strong);
        box-shadow: 0 0 0 3px rgba(255, 213, 79, 0.2);
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .remember {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: 4px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .remember input {
        margin-top: 3px;
        width: 18px;
        height: 18px;
        accent-color: var(--accent-strong);
        flex: 0 0 auto;
      }

      .remember-text {
        display: grid;
        gap: 4px;
      }

      .remember-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }

      .remember-note {
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }

      .button {
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
      }

      .button:active {
        transform: translateY(1px);
      }

      .button-primary {
        color: #6f004b;
        background: linear-gradient(135deg, #ffe082, #ffca28);
        box-shadow: 0 18px 32px rgba(77, 12, 43, 0.24);
      }

      .button-secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      .button[disabled] {
        cursor: wait;
        opacity: 0.7;
      }

      .status {
        display: none;
        margin-top: 14px;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 14px;
        line-height: 1.45;
      }

      .status-visible {
        display: block;
      }

      .status-error {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid rgba(255, 226, 226, 0.18);
      }

      .status-info {
        background: var(--success-bg);
        color: #fff0b2;
        border: 1px solid rgba(255, 213, 79, 0.18);
      }

      .tiny {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Biznesinfo.by</div>
      <h1>Вход на портал</h1>
      <p>
        В Telegram встроенный браузер не показывает стандартное окно авторизации, поэтому вход вынесен на эту страницу.
      </p>
      <p class="tiny">
        Введите те же логин и пароль, которые используются для доступа к порталу. После входа ссылка будет открываться нормально и в Telegram.
      </p>

      <form id="login-form" class="stack" autocomplete="on">
        <div>
          <label for="username">Логин</label>
          <input id="username" name="username" class="field" type="text" inputmode="text" autocomplete="username" placeholder="Например: AdminWeb" />
        </div>
        <div>
          <label for="password">Пароль</label>
          <input id="password" name="password" class="field" type="password" autocomplete="current-password" placeholder="Введите пароль" required />
        </div>
        <label class="remember" for="remember-login">
          <input id="remember-login" name="remember-login" type="checkbox" checked />
          <span class="remember-text">
            <span class="remember-title">Запомнить вход на этом устройстве</span>
            <span class="remember-note">Логин и пароль сохранятся только в этом браузере, чтобы потом не вводить их заново.</span>
          </span>
        </label>
        <div class="actions">
          <button id="submit-button" class="button button-primary" type="submit">Войти на портал</button>
          <button id="retry-button" class="button button-secondary" type="button">Открыть главную</button>
        </div>
      </form>

      <div id="status" class="status status-info" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var nextValue = params.get("next") || "/";
        if (!nextValue || nextValue.charAt(0) !== "/") nextValue = "/";

        var form = document.getElementById("login-form");
        var usernameInput = document.getElementById("username");
        var passwordInput = document.getElementById("password");
        var rememberInput = document.getElementById("remember-login");
        var submitButton = document.getElementById("submit-button");
        var retryButton = document.getElementById("retry-button");
        var statusBox = document.getElementById("status");
        var STORAGE_KEY = "biznesinfo.portal.login.v1";

        function setStatus(message, tone) {
          statusBox.textContent = message;
          statusBox.className = "status status-visible " + (tone === "error" ? "status-error" : "status-info");
        }

        function clearStatus() {
          statusBox.textContent = "";
          statusBox.className = "status status-info";
        }

        function encodeBase64(value) {
          var bytes = new TextEncoder().encode(value);
          var binary = "";
          for (var i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
          return btoa(binary);
        }

        function readStoredLogin() {
          try {
            var raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object") return null;
            var username = typeof parsed.username === "string" ? parsed.username.trim() : "";
            var password = typeof parsed.password === "string" ? parsed.password : "";
            if (!username || !password) return null;
            return { username: username, password: password };
          } catch (error) {
            return null;
          }
        }

        function clearStoredLogin() {
          try {
            window.localStorage.removeItem(STORAGE_KEY);
          } catch (error) {
            // ignore storage failures
          }
        }

        function storeLogin(username, password) {
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
              username: username,
              password: password
            }));
          } catch (error) {
            // ignore storage failures
          }
        }

        function runLogin(username, password, source) {
          submitButton.disabled = true;
          submitButton.textContent = source === "stored" ? "Проверяю сохранённый вход..." : "Проверяю...";

          return fetch("/__portal-auth-check", {
            method: "GET",
            cache: "no-store",
            credentials: "same-origin",
            headers: {
              Authorization: "Basic " + encodeBase64(username + ":" + password),
              "X-Requested-With": "biznesinfo-portal-login"
            }
          })
            .then(function (response) {
              var redirectedBackToLogin = response.redirected || /\/__portal-login(?:\?|$)/.test(response.url || "");
              if (response.ok && !redirectedBackToLogin) {
                if (rememberInput.checked) {
                  storeLogin(username, password);
                } else {
                  clearStoredLogin();
                }
                setStatus("Доступ подтверждён. Открываю портал...", "info");
                window.location.replace(nextValue);
                return;
              }

              if (redirectedBackToLogin || response.status === 401) {
                if (source === "stored") {
                  clearStoredLogin();
                  rememberInput.checked = false;
                  setStatus("Сохранённый пароль больше не подошёл. Введите его заново.", "error");
                  return;
                }
                setStatus("Логин или пароль не подошли. Проверьте данные и попробуйте ещё раз.", "error");
                return;
              }

              setStatus("Не удалось открыть портал. Попробуйте ещё раз через пару секунд.", "error");
            })
            .catch(function () {
              setStatus("Ошибка сети. Проверьте соединение и повторите попытку.", "error");
            })
            .finally(function () {
              submitButton.disabled = false;
              submitButton.textContent = "Войти на портал";
            });
        }

        retryButton.addEventListener("click", function () {
          window.location.href = "/";
        });

        var storedLogin = readStoredLogin();
        if (storedLogin) {
          usernameInput.value = storedLogin.username;
          passwordInput.value = storedLogin.password;
          rememberInput.checked = true;
          setStatus("Нашла сохранённый вход. Проверяю его автоматически...", "info");
          window.setTimeout(function () {
            runLogin(storedLogin.username, storedLogin.password, "stored");
          }, 120);
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          clearStatus();

          var username = (usernameInput.value || "").trim();
          var password = passwordInput.value || "";
          if (!username || !password) {
            setStatus("Введите логин и пароль, чтобы открыть портал.", "error");
            return;
          }

          runLogin(username, password, "manual");
        });
      })();
    </script>
  </body>
</html>
